name: Industry Section Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: industry-section-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run industry section bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: once
          TELEGRAM_NOTIFY_ERRORS: true
          INDUSTRY_ARTICLE_LIMIT: 15
          INDUSTRY_VIEWPORT_WIDTH: 1440
          INDUSTRY_VIEWPORT_HEIGHT: 1800
          INDUSTRY_FULL_PAGE_SCREENSHOT: false
          INDUSTRY_HEADLESS: true
        run: python industry_section_telegram_bot.py --once
