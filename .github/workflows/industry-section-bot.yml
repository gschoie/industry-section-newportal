name: Industry Section Bot

on:
  schedule:
    # 매 10분 회전(--rotate): 시간당 6개 섹션이 한 바퀴 — 정각 6연발 대신 10분에 하나씩.
    # GitHub 크론은 수 분 지연될 수 있음(순서는 상태 포인터가 보존).
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# 크론 지연으로 두 틱이 겹치면 뒤 run이 줄을 선다(취소 아님) — 상태 파일 경합 방지.
concurrency:
  group: industry-section-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 크로미엄을 매번 새로 받으면 실행당 3분+ — 캐시로 실행시간을 1분 수준으로 줄인다.
      # 캐시 키는 requirements 해시가 아니라 실제 설치된 playwright 버전으로:
      # >=1.45 라 pip이 최신을 깔는데, 파일 해시 키는 안 바뀌어 옛 브라우저가 계속
      # 히트했고 1.63 업그레이드에서 실행 파일 불일치로 9/16부터 전패했다.
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      # 변경 감지 + 회전 포인터 상태를 실행 간 유지 (없으면 매번 전부 "변경"으로 잡힘).
      - name: Restore change-detection state
        uses: actions/cache@v5
        with:
          path: industry_section_state.json
          key: industry-state-${{ github.run_id }}
          restore-keys: |
            industry-state-

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INDUSTRY_ARTICLE_LIMIT: "5"
          INDUSTRY_DETECT_TOP_N: "2"
          TELEGRAM_NOTIFY_ERRORS: "false"
        # 스케줄 = 회전(섹션 1개), 수동 실행 = 전체 6개 한 번에(테스트용)
        run: python industry_section_telegram_bot.py ${{ github.event_name == 'schedule' && '--rotate' || '--once' }}
