name: Industry Section Bot

on:
  schedule:
    # 매시간 정각(UTC) 실행. GitHub 부하에 따라 수 분 지연될 수 있음.
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: industry-section-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # 변경 감지 상태를 실행 간 유지 (없으면 매번 전부 "변경"으로 잡힘).
      - name: Restore change-detection state
        uses: actions/cache@v4
        with:
          path: industry_section_state.json
          key: industry-state-${{ github.run_id }}
          restore-keys: |
            industry-state-

      - name: Run bot (once)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_MODE: once
          INDUSTRY_ARTICLE_LIMIT: "5"
          INDUSTRY_DETECT_TOP_N: "2"
          TELEGRAM_NOTIFY_ERRORS: "false"
        run: python industry_section_telegram_bot.py --once
